<div class="content">
    <h2>Главный Результат: Цифры Говорят Сами За Себя</h2>
    
    <div class="results-container">
        <!-- Время на отчетность -->
        <div class="result-card">
            <div class="result-header">
                <img src="assets/icons/time.svg" alt="Время">
                <h3>ВРЕМЯ на отчетность</h3>
            </div>
            <div class="comparison">
                <div class="before">
                    <span>Было:</span>
                    <span class="value">3.2 ч/док</span>
                </div>
                <div class="arrow">→</div>
                <div class="after positive">
                    <span>Стало:</span>
                    <span class="value">0.8 ч/док</span>
                    <span class="change">⬇️ 75%</span>
                </div>
            </div>
        </div>
        
        <!-- Ошибки в отчетности -->
        <div class="result-card">
            <div class="result-header">
                <img src="assets/icons/error.svg" alt="Ошибки">
                <h3>ОШИБКИ в отчетности</h3>
            </div>
            <div class="comparison">
                <div class="before">
                    <span>Было:</span>
                    <span class="value">5 шт/период</span>
                </div>
                <div class="arrow">→</div>
                <div class="after positive">
                    <span>Стало:</span>
                    <span class="value">1 шт/период</span>
                    <span class="change">⬇️ 80%</span>
                </div>
            </div>
            <p class="sub-result">⬇️92% нарушений сроков</p>
        </div>
        
        <!-- Затраты на бухгалтерию -->
        <div class="result-card">
            <div class="result-header">
                <img src="assets/icons/money.svg" alt="Затраты">
                <h3>ЗАТРАТЫ на бухгалтерию</h3>
            </div>
            <div class="comparison">
                <div class="before">
                    <span>Было:</span>
                    <span class="value">100%</span>
                </div>
                <div class="arrow">→</div>
                <div class="after positive">
                    <span>Стало:</span>
                    <span class="value">70%</span>
                    <span class="change">⬇️ 30%</span>
                </div>
            </div>
            <p class="sub-result">Пример: ООО сэкономил 45 000 руб./мес.</p>
        </div>
    </div>
</div>
