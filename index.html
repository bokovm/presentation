<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автоматизация бухучета | Исследование</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <!-- Навигационные кнопки удалены. Переключение только по стрелкам клавиатуры. -->
    <!-- Счетчик слайдов также удален, так как он был частью навигации. -->

    <div class="slides-container" id="slides-container">
    </div>

    <script src="js/chart-config.js"></script>
    <script src="js/roi-chart.js"></script>
    <script src="js/results-chart.js"></script>
    <script src="js/comparison.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('slides-container');
            const slideFiles = [
                "slides/00-cover.html", 
                "slides/01-problem.html", 
                "slides/02-hypothesis.html", 
                "slides/03-goals.html",
                "slides/04-methodology.html", 
                "slides/05-results.html",
                "slides/06-roi.html", 
                "slides/07-solutions.html",
                "slides/08-trends.html", 
                "slides/09-checklist.html",
                "slides/10-implementation.html", 
                "slides/11-risks.html",
                "slides/12-nnov-context.html", 
                "slides/13-conclusion.html",
                "slides/14-thanks.html"
            ];
            
            // Загрузка слайдов
            for (const file of slideFiles) {
                try {
                    const response = await fetch(file);
                    const html = await response.text();
                    container.innerHTML += html;
                } catch (error) {
                    console.error(`Ошибка загрузки слайда: ${file}`, error);
                }
            }
            
            // Инициализация презентации
            if (window.initPresentation) {
                window.initPresentation();
            }
        });
    </script>
</body>
</html>
